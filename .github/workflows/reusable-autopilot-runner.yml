name: "Reusable Autopilot: Runner"

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string
      issue_title:
        description: 'Issue title (for context)'
        required: false
        type: string
        default: ''
      track:
        description: 'Track: bugs or features'
        required: true
        type: string
      base:
        description: 'Base branch'
        required: true
        type: string
      head:
        description: 'Head branch (autofix/issue-<id>)'
        required: true
        type: string
      max_claude_turns:
        description: 'Max turns for Claude in RLM'
        required: false
        type: number
        default: 60
      writer_timeout_minutes:
        description: 'Wall-clock budget (minutes) for the Claude writer job (passed through to the RLM fix engine)'
        required: false
        type: number
        default: 30
      claude_provider:
        description: 'Provider for Claude Code scout/packet/writer stages: openrouter or anthropic'
        required: false
        type: string
        default: 'openrouter'
      max_rlm_cost:
        description: 'Max cost for RLM codebase analysis ($)'
        required: false
        type: number
        default: 2
      rlm_model:
        description: 'OpenRouter model for RLM codebase analysis'
        required: false
        type: string
        default: 'anthropic/claude-sonnet-4.6'
      scout_model:
        description: 'Optional Claude Code model for scout and packet stages'
        required: false
        type: string
        default: ''
      claude_model:
        description: 'Claude Code model for autofix writer'
        required: false
        type: string
        default: 'anthropic/claude-opus-4.6'
      shared_tools_ref:
        description: 'Immutable cloudwarriors-ai/.github commit used for shared scripts'
        required: false
        type: string
        default: '3e21e600cc5ba2a8ddf80903a76fd2dbb6f04283'
    secrets:
      WORKFLOW_PAT:
        required: true
      ANTHROPIC_API_KEY:
        # Direct Anthropic billing. Required when claude_provider=anthropic.
        required: false
      OPENROUTER_API_KEY:
        required: true
      VALIDATION_ATTESTATION_KEY:
        required: false
      E2E_EMAIL:
        required: false
      E2E_PASSWORD:
        required: false
      DATABASE_URL:
        required: false
      PII_ENCRYPTION_KEY:
        required: false
      PII_HMAC_KEY:
        required: false
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      PREVIEW_MARKER_TOKEN:
        # A separate identity with Issues write plus Pull Requests/Contents read
        # for the authoritative Praxis marker and shadow-source resolution.
        # It is never exposed to a job that executes feature-controlled code.
        required: true

concurrency:
  group: autopilot-runner-${{ inputs.issue_number }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  # ── Job 1: Call RLM fix engine ──────────────────────────────────────
  rlm-fix:
    name: "RLM Fix (#${{ inputs.issue_number }})"
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: cloudwarriors-ai/workflows/.github/workflows/reusable-claude-autofix-rlm.yml@e5fe345623f53cb07e15afdba661a9e77bbcdd0f
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
      max_claude_turns: ${{ inputs.max_claude_turns }}
      writer_timeout_minutes: ${{ inputs.writer_timeout_minutes }}
      claude_provider: ${{ inputs.claude_provider }}
      max_rlm_cost: ${{ inputs.max_rlm_cost }}
      rlm_model: ${{ inputs.rlm_model }}
      scout_model: ${{ inputs.scout_model }}
      claude_model: ${{ inputs.claude_model }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # ── Job 2: Read project config ──────────────────────────────────────
  read-config:
    name: "Read Config"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      config_json: ${{ steps.config.outputs.config_json }}
      build_command: ${{ steps.config.outputs.build_command }}
      lint_command: ${{ steps.config.outputs.lint_command }}
      test_command: ${{ steps.config.outputs.test_command }}
      app_test_command: ${{ steps.config.outputs.app_test_command }}
      db_migrate_command: ${{ steps.config.outputs.db_migrate_command }}
      health_endpoint: ${{ steps.config.outputs.health_endpoint }}
      frontend_health_endpoint: ${{ steps.config.outputs.frontend_health_endpoint }}
      preview_deploy: ${{ steps.config.outputs.preview_deploy }}
      # Opt-in preview gate: hold a successful FEATURE preview for a human verdict
      # instead of tearing it down and merging. Finalize owns the hold decision.
      preview_gate: ${{ steps.config.outputs.preview_gate }}
      validation_state: ${{ steps.config.outputs.validation_state }}
      auto_merge: ${{ steps.config.outputs.auto_merge }}
      runtime: ${{ steps.config.outputs.runtime }}
      python_version: ${{ steps.config.outputs.python_version }}
      python_requirements: ${{ steps.config.outputs.python_requirements }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Read .autopilot/config.json
        id: config
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED || 'true' }}
        run: |
          if [ -f .autopilot/config.json ]; then
            CONFIG=$(cat .autopilot/config.json)
            echo "config_json<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFIG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"

            echo "build_command=$(echo "$CONFIG" | jq -r '.buildCommand // ""')" >> "$GITHUB_OUTPUT"
            echo "lint_command=$(echo "$CONFIG" | jq -r '.lintCommand // ""')" >> "$GITHUB_OUTPUT"
            echo "test_command=$(echo "$CONFIG" | jq -r '.testCommand // ""')" >> "$GITHUB_OUTPUT"
            # Multi-line command (may contain && or newlines) — emit via heredoc.
            APP_TEST_CMD=$(echo "$CONFIG" | jq -r '.appTestCommand // ""')
            echo "app_test_command<<APP_TEST_EOF" >> "$GITHUB_OUTPUT"
            echo "$APP_TEST_CMD" >> "$GITHUB_OUTPUT"
            echo "APP_TEST_EOF" >> "$GITHUB_OUTPUT"
            echo "db_migrate_command=$(echo "$CONFIG" | jq -r '.dbMigrateCommand // ""')" >> "$GITHUB_OUTPUT"
            echo "health_endpoint=$(echo "$CONFIG" | jq -r '.healthEndpoint // "/api/v1/health"')" >> "$GITHUB_OUTPUT"
            echo "frontend_health_endpoint=$(echo "$CONFIG" | jq -r '.frontendHealthEndpoint // "/"')" >> "$GITHUB_OUTPUT"
            CONFIG_PREVIEW_DEPLOY=$(echo "$CONFIG" | jq -r '.previewDeploy // false')
            if [ "${DEPLOY_ENABLED,,}" = "false" ]; then
              echo "DEPLOY_ENABLED=false -- overriding previewDeploy to false"
              echo "preview_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "preview_deploy=$CONFIG_PREVIEW_DEPLOY" >> "$GITHUB_OUTPUT"
            fi
            echo "preview_gate=$(echo "$CONFIG" | jq -r '.previewGate // false')" >> "$GITHUB_OUTPUT"
            echo "validation_state=$(echo "$CONFIG" | jq -r '.validation.state // "active"')" >> "$GITHUB_OUTPUT"
            echo "auto_merge=$(echo "$CONFIG" | jq -r '.mergeRequirements.autoMerge // false')" >> "$GITHUB_OUTPUT"
            echo "runtime=$(echo "$CONFIG" | jq -r '.runtime // ""')" >> "$GITHUB_OUTPUT"
            echo "python_version=$(echo "$CONFIG" | jq -r '.pythonVersion // "3.11"')" >> "$GITHUB_OUTPUT"
            echo "python_requirements=$(echo "$CONFIG" | jq -r '.pythonRequirements // "service/requirements.txt"')" >> "$GITHUB_OUTPUT"
          else
            echo "No .autopilot/config.json found — using defaults" >&2
            echo "config_json={}" >> "$GITHUB_OUTPUT"
            echo "build_command=" >> "$GITHUB_OUTPUT"
            echo "lint_command=" >> "$GITHUB_OUTPUT"
            echo "test_command=" >> "$GITHUB_OUTPUT"
            echo "app_test_command=" >> "$GITHUB_OUTPUT"
            echo "db_migrate_command=" >> "$GITHUB_OUTPUT"
            echo "health_endpoint=/api/v1/health" >> "$GITHUB_OUTPUT"
            echo "frontend_health_endpoint=/" >> "$GITHUB_OUTPUT"
            echo "preview_deploy=false" >> "$GITHUB_OUTPUT"
            echo "preview_gate=false" >> "$GITHUB_OUTPUT"
            echo "validation_state=active" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            echo "runtime=" >> "$GITHUB_OUTPUT"
            echo "python_version=3.11" >> "$GITHUB_OUTPUT"
            echo "python_requirements=service/requirements.txt" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2.5: Verify fix branch exists before gates ─────────────────
  verify-fix-branch:
    name: "Verify Fix Branch (#${{ inputs.issue_number }})"
    needs: [rlm-fix, read-config]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 3

    outputs:
      branch_ready: ${{ steps.branch.outputs.branch_ready }}
      has_changes: ${{ steps.branch.outputs.has_changes }}
      head_sha: ${{ steps.branch.outputs.head_sha }}
      failure_reason: ${{ steps.branch.outputs.failure_reason }}
      already_fixed: ${{ steps.branch.outputs.already_fixed }}
      already_fixed_reason: ${{ steps.branch.outputs.already_fixed_reason }}

    steps:
      - name: Check head branch and diff
        id: branch
        uses: actions/github-script@v7
        with:
          # This step only reads a branch and compares commits. The ambient
          # read-only token is sufficient and remains available on failure paths.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = '${{ inputs.head }}';
            const base = '${{ inputs.base }}';

            core.setOutput('branch_ready', 'false');
            core.setOutput('has_changes', 'false');
            core.setOutput('head_sha', '');
            core.setOutput('failure_reason', '');
            core.setOutput('already_fixed', 'false');
            core.setOutput('already_fixed_reason', '');

            if ('${{ needs.rlm-fix.result }}' !== 'success') {
              core.setOutput('failure_reason', 'rlm-fix-failed');
              core.notice(`RLM fix job result was ${{ needs.rlm-fix.result }}; downstream gates will not run`);
              return;
            }

            if ('${{ needs.rlm-fix.outputs.already_fixed }}' === 'true') {
              core.setOutput('already_fixed', 'true');
              core.setOutput('already_fixed_reason', '${{ needs.rlm-fix.outputs.already_fixed_reason }}');
              core.setOutput('failure_reason', 'already-fixed');
              core.notice('RLM fix reported that the base branch already satisfies the issue; no fix branch is required');
              return;
            }

            let headSha = '';
            try {
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: head });
              headSha = branch.commit.sha;
              if (!/^[0-9a-f]{40}$/.test(headSha)) {
                core.setFailed(`Branch ${head} resolved to an invalid commit SHA`);
                return;
              }
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('failure_reason', 'missing-head-branch');
                core.notice(`Fix branch ${head} was not pushed`);
                return;
              }
              throw error;
            }

            try {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${headSha}`,
              });
              const changedFiles = comparison.files || [];
              if (changedFiles.length === 0) {
                core.setOutput('failure_reason', 'empty-diff');
                core.notice(`Fix branch ${head} exists but has no diff against ${base}`);
                return;
              }
              core.setOutput('branch_ready', 'true');
              core.setOutput('has_changes', 'true');
              core.setOutput('head_sha', headSha);
              core.notice(`Fix branch ${head} is frozen at ${headSha} with ${changedFiles.length} changed file(s)`);
            } catch (error) {
              core.setOutput('failure_reason', 'compare-failed');
              core.setFailed(`Could not compare ${base}...${head}: ${error.message}`);
            }

  # ── Job 3: Validate fix bundle ─────────────────────────────────────
  validate:
    name: "Validate (#${{ inputs.issue_number }})"
    needs: [rlm-fix, read-config, verify-fix-branch]
    if: |
      always() && !cancelled() &&
      needs.verify-fix-branch.outputs.branch_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: Checkout fix branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-fix-branch.outputs.head_sha }}
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch shared scripts
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          SHARED_TOOLS_REF: ${{ inputs.shared_tools_ref }}
        run: |
          set -euo pipefail
          git init /tmp/org-github
          git -C /tmp/org-github remote add origin \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/cloudwarriors-ai/.github.git"
          git -C /tmp/org-github fetch --depth 1 origin "$SHARED_TOOLS_REF"
          git -C /tmp/org-github remote set-url origin https://github.com/cloudwarriors-ai/.github.git
          git -C /tmp/org-github checkout --detach FETCH_HEAD
          test "$(git -C /tmp/org-github rev-parse HEAD)" = "$SHARED_TOOLS_REF"

      - name: Validate issue bundle
        id: validate
        continue-on-error: true
        env:
          ISSUE_NUM: ${{ inputs.issue_number }}
          ISSUE_BASE: ${{ inputs.base }}
          ISSUE_TRACK: ${{ inputs.track }}
          ISSUE_HEAD: ${{ inputs.head }}
        run: |
          npx tsx /tmp/org-github/scripts/autopilot/validate-issue-bundle.ts \
            --issue "$ISSUE_NUM" \
            --base "$ISSUE_BASE" \
            --track "$ISSUE_TRACK" \
            --head "$ISSUE_HEAD"

          if [ $? -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 4: Preflight CI ────────────────────────────────────────────
  preflight:
    name: "Preflight (#${{ inputs.issue_number }})"
    needs: [rlm-fix, read-config, verify-fix-branch]
    if: |
      always() && !cancelled() &&
      needs.verify-fix-branch.outputs.branch_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      preflight_passed: ${{ steps.preflight.outputs.passed }}

    steps:
      - name: Checkout fix branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-fix-branch.outputs.head_sha }}
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: false

      - name: Run project preflight
        id: preflight
        continue-on-error: true
        run: |
          if [ -f .autopilot/preflight.sh ]; then
            chmod +x .autopilot/preflight.sh
            ./.autopilot/preflight.sh
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .autopilot/preflight.sh — skipping"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 5: Deploy preview container ────────────────────────────────
  deploy-preview:
    name: "Deploy Preview (#${{ inputs.issue_number }})"
    needs: [rlm-fix, read-config, verify-fix-branch, preflight]
    if: |
      needs.verify-fix-branch.outputs.branch_ready == 'true' &&
      needs.read-config.outputs.preview_deploy == 'true' &&
      vars.DEPLOY_ENABLED != 'false' &&
      needs.preflight.outputs.preflight_passed == 'true'
    runs-on: ubuntu-latest
    # Capacity-four deploys have taken just over 13 minutes in live measurements.
    # Leave room for one 25-minute attempt, backoff, and a second attempt.
    timeout-minutes: 55
    environment: ${{ inputs.base == 'main' && 'production' || 'dev' }}

    outputs:
      preview_url:  ${{ steps.set-url.outputs.preview_url }}
      backend_url:  ${{ steps.set-url.outputs.backend_url }}
      deployed_sha: ${{ steps.shadow-prep.outputs.deploy_sha || needs.verify-fix-branch.outputs.head_sha }}
      # source_repo is set on shadow runs; empty on non-shadow. Used by validate-api
      # to point Sentinel's manifest checkout at the source repo (which has validation.json).
      source_repo:  ${{ steps.shadow-prep.outputs.source_repo }}
      # preview_deployed reflects whether VPS deploy succeeded (after retries).
      # false → downstream preview-dependent jobs (validate-api, app-tests) skip,
      # the job still ends success so finalize runs and can produce a labeled PR.
      preview_deployed: ${{ steps.deploy-status.outputs.preview_deployed }}

    steps:
      - name: Check kill switch
        if: vars.DEPLOY_ENABLED == 'false'
        run: |
          echo "Deploy disabled for this environment"
          exit 1

      - name: Push shadow fix to source repo for VPS deploy
        id: shadow-prep
        if: contains(github.repository, '-shadow')
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ inputs.base }}
          VERIFIED_HEAD_SHA: ${{ needs.verify-fix-branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config --global user.name "Claude Code Bot"
          git config --global user.email "claude-bot@anthropic.com"

          SHADOW_REPO="${{ github.repository }}"
          SOURCE_REPO="${SHADOW_REPO%-shadow}"
          PREVIEW_BRANCH="shadow-preview/issue-${ISSUE_NUM}"

          # Clone source at base branch and create the preview branch
          git clone --no-tags --branch "$BASE_BRANCH" \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/${SOURCE_REPO}.git" source
          git -C source checkout -b "$PREVIEW_BRANCH"

          # Fetch shadow fix branch and extract only application changes
          git clone --no-tags \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/${SHADOW_REPO}.git" shadow
          git -C shadow fetch origin "$VERIFIED_HEAD_SHA"
          git -C shadow diff --binary \
            "origin/${BASE_BRANCH}...${VERIFIED_HEAD_SHA}" \
            -- . \
            ':(exclude).shadow' \
            ':(exclude).github/workflows/claude-ci.yml' \
            ':(exclude).github/workflows/autopilot-runner.yml' \
            > /tmp/shadow-preview.patch

          if [ ! -s /tmp/shadow-preview.patch ]; then
            echo "::warning::No application changes found in shadow fix"
            echo "deploy_head=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "source_repo=${SOURCE_REPO}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C source apply --index --3way /tmp/shadow-preview.patch
          git -C source commit -m "shadow-preview: autofix for issue #${ISSUE_NUM}"
          git -C source push origin "HEAD:${PREVIEW_BRANCH}" --force

          echo "deploy_head=${PREVIEW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_repo=${SOURCE_REPO}" >> "$GITHUB_OUTPUT"
          echo "Pushed shadow diff → ${SOURCE_REPO}:${PREVIEW_BRANCH}"

      # Deploy preview to VPS — two attempts with backoff. The VPS deploy step is
      # the second-most common failure surface in historical runs (SSH/network flake
      # against the preview environment). Each attempt is independently scoped so
      # transient failures recover without taking down the rest of the pipeline.
      # Join the tailnet before SSHing to the VPS. Its public port 22 is firewalled
      # (runner-side symptom: "dial tcp <host>:22: i/o timeout" on every attempt,
      # while the step is continue-on-error, so the job still reports success and
      # preview_deployed=false silently skips every preview-dependent check).
      # Same join scopely/deploy-dev.yml uses; SSH_HOST is then the tailnet address.
      # Skipped when the caller has no TS_OAUTH_* secrets, so callers that reach
      # their host another way are unaffected.
      - name: Connect to Tailscale
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.98.8
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      - name: Deploy preview to VPS (attempt 1)
        id: deploy-1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          envs: DEPLOY_HEAD,DEPLOY_SHA,DEPLOY_ISSUE,VPS_PATH,DATABASE_URL,E2E_EMAIL,E2E_PASSWORD,PII_ENCRYPTION_KEY,PII_HMAC_KEY,PREVIEW_PREFIX,PREVIEW_DOMAIN,PREVIEW_MODE,PREVIEW_PORT_BASE,PREVIEW_TS_HOST,PREVIEW_CAPACITY
          script: |
            cd "$VPS_PATH"
            git fetch origin dev --depth 1
            git checkout origin/dev -- scripts/ .autopilot/
            "$VPS_PATH/scripts/preview-deploy.sh" "$DEPLOY_HEAD" "$DEPLOY_ISSUE" "$DEPLOY_SHA"
        env:
          DEPLOY_HEAD: ${{ steps.shadow-prep.outputs.deploy_head || inputs.head }}
          DEPLOY_SHA: ${{ steps.shadow-prep.outputs.deploy_sha || needs.verify-fix-branch.outputs.head_sha }}
          DEPLOY_ISSUE: ${{ inputs.issue_number }}
          VPS_PATH: ${{ vars.VPS_REPO_PATH }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_MODE: ${{ vars.PREVIEW_MODE || '' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '' }}
          # Capacity belt for the repo's preview-deploy.sh: the host refuses to stand up more
          # previews than this (Praxis is the authority; this catches manual/out-of-band runs).
          PREVIEW_CAPACITY: ${{ vars.PREVIEW_CAPACITY || '' }}
          PREVIEW_TS_HOST: ${{ vars.PREVIEW_TS_HOST || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          PII_HMAC_KEY: ${{ secrets.PII_HMAC_KEY }}

      - name: Wait before retry
        if: steps.deploy-1.outcome == 'failure'
        run: |
          echo "First deploy attempt failed — waiting 60s before retry."
          sleep 60

      - name: Deploy preview to VPS (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          envs: DEPLOY_HEAD,DEPLOY_SHA,DEPLOY_ISSUE,VPS_PATH,DATABASE_URL,E2E_EMAIL,E2E_PASSWORD,PII_ENCRYPTION_KEY,PII_HMAC_KEY,PREVIEW_PREFIX,PREVIEW_DOMAIN,PREVIEW_MODE,PREVIEW_PORT_BASE,PREVIEW_TS_HOST,PREVIEW_CAPACITY
          script: |
            cd "$VPS_PATH"
            git fetch origin dev --depth 1
            git checkout origin/dev -- scripts/ .autopilot/
            "$VPS_PATH/scripts/preview-deploy.sh" "$DEPLOY_HEAD" "$DEPLOY_ISSUE" "$DEPLOY_SHA"
        env:
          DEPLOY_HEAD: ${{ steps.shadow-prep.outputs.deploy_head || inputs.head }}
          DEPLOY_SHA: ${{ steps.shadow-prep.outputs.deploy_sha || needs.verify-fix-branch.outputs.head_sha }}
          DEPLOY_ISSUE: ${{ inputs.issue_number }}
          VPS_PATH: ${{ vars.VPS_REPO_PATH }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_MODE: ${{ vars.PREVIEW_MODE || '' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '' }}
          # Capacity belt for the repo's preview-deploy.sh: the host refuses to stand up more
          # previews than this (Praxis is the authority; this catches manual/out-of-band runs).
          PREVIEW_CAPACITY: ${{ vars.PREVIEW_CAPACITY || '' }}
          PREVIEW_TS_HOST: ${{ vars.PREVIEW_TS_HOST || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          PII_HMAC_KEY: ${{ secrets.PII_HMAC_KEY }}

      - name: Set preview URL output
        id: set-url
        env:
          ISSUE_NUM: ${{ inputs.issue_number }}
          # Repo-scoped preview naming. Defaults reproduce the historical scopely shape
          # (preview-N.pscx.ai). A second preview-enabled repo MUST set PREVIEW_PREFIX
          # (e.g. "preview-cube-") or its issue numbers collide with scopely's on the
          # same Traefik host rules.
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          # Optional templates for non-DNS exposure (tailnet-only previews via `tailscale serve`):
          #   PREVIEW_URL_TEMPLATE=https://noob-root.tailcc6c5f.ts.net:{port_api}
          #   PREVIEW_BACKEND_URL_TEMPLATE=https://noob-root.tailcc6c5f.ts.net:{port}
          # Placeholders: {prefix} {issue} {domain} {port}=PREVIEW_PORT_BASE+issue {port_api}=port+1000.
          # Unset → the historical DNS shape below, byte for byte.
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE || '' }}
          PREVIEW_BACKEND_URL_TEMPLATE: ${{ vars.PREVIEW_BACKEND_URL_TEMPLATE || '' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
        run: |
          PORT=$((PREVIEW_PORT_BASE + ISSUE_NUM)); PORT_API=$((PORT + 1000))
          render() { echo "$1" | sed -e "s/{prefix}/${PREVIEW_PREFIX}/g" -e "s/{issue}/${ISSUE_NUM}/g" -e "s/{domain}/${PREVIEW_DOMAIN}/g" -e "s/{port_api}/${PORT_API}/g" -e "s/{port}/${PORT}/g"; }
          if [ -n "$PREVIEW_URL_TEMPLATE" ]; then PREVIEW_URL="$(render "$PREVIEW_URL_TEMPLATE")"; else PREVIEW_URL="https://${PREVIEW_PREFIX}${ISSUE_NUM}.${PREVIEW_DOMAIN}"; fi
          # Use flat subdomain (<prefix>N-api) so the *.<domain> wildcard cert covers it;
          # <prefix>N.api.<domain> is 3rd-level and not covered by the wildcard.
          if [ -n "$PREVIEW_BACKEND_URL_TEMPLATE" ]; then BACKEND_URL="$(render "$PREVIEW_BACKEND_URL_TEMPLATE")"; else BACKEND_URL="https://${PREVIEW_PREFIX}${ISSUE_NUM}-api.${PREVIEW_DOMAIN}"; fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview is reachable
        id: verify-preview
        if: steps.deploy-1.outcome == 'success' || steps.deploy-2.outcome == 'success'
        continue-on-error: true
        run: |
          HEALTH="${{ needs.read-config.outputs.frontend_health_endpoint }}"
          URL="${{ steps.set-url.outputs.preview_url }}${HEALTH}"
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "$URL" > /dev/null 2>&1; then
              echo "Preview reachable at $URL"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Preview not reachable at $URL" >&2
          exit 1

      - name: Verify backend URL is reachable
        id: verify-backend
        if: steps.deploy-1.outcome == 'success' || steps.deploy-2.outcome == 'success'
        continue-on-error: true
        run: |
          HEALTH="${{ needs.read-config.outputs.health_endpoint }}"
          URL="${{ steps.set-url.outputs.backend_url }}${HEALTH}"
          for i in $(seq 1 18); do
            if curl -sf --max-time 5 "$URL" > /dev/null 2>&1; then
              echo "Backend reachable at $URL"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Backend not reachable at $URL after 180s" >&2
          exit 1

      - name: Set preview deploy status
        id: deploy-status
        if: always()
        run: |
          if { [ "${{ steps.deploy-1.outcome }}" = "success" ] || [ "${{ steps.deploy-2.outcome }}" = "success" ]; } \
            && [ "${{ steps.verify-preview.outcome }}" = "success" ] \
            && [ "${{ steps.verify-backend.outcome }}" = "success" ]; then
            echo "preview_deployed=true" >> "$GITHUB_OUTPUT"
            echo "Preview deploy and both reachability checks succeeded."
          else
            echo "preview_deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview deploy or reachability failed — downstream preview-dependent checks will be skipped and release readiness will fail closed."
          fi

  # ── Job 6: Run tests ───────────────────────────────────────────────
  test:
    name: "Test (#${{ inputs.issue_number }})"
    needs: [read-config, verify-fix-branch, deploy-preview]
    if: |
      always() && !cancelled() &&
      needs.verify-fix-branch.outputs.branch_ready == 'true' &&
      needs.read-config.outputs.test_command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      tests_passed: ${{ steps.result.outputs.tests_passed }}

    steps:
      - name: Checkout fix branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-fix-branch.outputs.head_sha }}
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: false

      - name: Resolve preview URL inside this job
        if: needs.deploy-preview.outputs.preview_deployed == 'true'
        env:
          OUTPUT_PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url || '' }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE || '' }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          port=$((PREVIEW_PORT_BASE + ISSUE_NUM)); port_api=$((port + 1000))
          render() { echo "$1" | sed -e "s/{prefix}/${PREVIEW_PREFIX}/g" -e "s/{issue}/${ISSUE_NUM}/g" -e "s/{domain}/${PREVIEW_DOMAIN}/g" -e "s/{port_api}/${port_api}/g" -e "s/{port}/${port}/g"; }
          url="$OUTPUT_PREVIEW_URL"
          if [ -n "$PREVIEW_URL_TEMPLATE" ]; then url="$(render "$PREVIEW_URL_TEMPLATE")"; fi
          if ! [[ "$url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "ERROR: could not derive the preview URL inside the test job" >&2
            exit 1
          fi
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Setup Python
        if: needs.read-config.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.read-config.outputs.python_version }}
          cache: pip

      - name: Install Python dependencies
        if: needs.read-config.outputs.runtime == 'python'
        env:
          REQS: ${{ needs.read-config.outputs.python_requirements }}
        run: |
          if [ -f "$REQS" ]; then
            python -m pip install --upgrade pip
            pip install -r "$REQS"
          else
            echo "python requirements file not found at '$REQS' — skipping pip install" >&2
          fi

      - name: Run test command
        id: test
        continue-on-error: true
        run: ${{ needs.read-config.outputs.test_command }}

      - name: Determine result
        id: result
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 7: Teardown preview ────────────────────────────────────────
  # Finalize owns the preview-hold decision and reports true only after it has a
  # reviewable PR and successfully posts the Praxis marker. Every other path tears
  # down, including a failed marker step, so no preview can be stranded without a
  # release mechanism. Praxis later reclaims a held preview through
  # reusable-preview-teardown.yml.
  teardown-preview:
    name: "Teardown Preview (#${{ inputs.issue_number }})"
    needs: [read-config, deploy-preview, finalize]
    if: |
      always() && needs.deploy-preview.result != 'skipped' &&
      needs.finalize.outputs.preview_held != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.base == 'main' && 'production' || 'dev' }}

    steps:
      # Join the tailnet before SSHing to the VPS. Its public port 22 is firewalled
      # (runner-side symptom: "dial tcp <host>:22: i/o timeout" on every attempt,
      # while the step is continue-on-error, so the job still reports success and
      # preview_deployed=false silently skips every preview-dependent check).
      # Same join scopely/deploy-dev.yml uses; SSH_HOST is then the tailnet address.
      # Skipped when the caller has no TS_OAUTH_* secrets, so callers that reach
      # their host another way are unaffected.
      - name: Connect to Tailscale
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.98.8
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      - name: Teardown preview on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_ISSUE,VPS_PATH,PREVIEW_PORT_BASE
          script: |
            cd "$VPS_PATH"
            git fetch origin dev --depth 1
            git checkout origin/dev -- scripts/ .autopilot/
            "$VPS_PATH/scripts/preview-teardown.sh" "$DEPLOY_ISSUE"
        env:
          DEPLOY_ISSUE: ${{ inputs.issue_number }}
          VPS_PATH: ${{ vars.VPS_REPO_PATH }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}

      - name: Delete shadow preview branch from source repo
        if: contains(github.repository, '-shadow')
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          SOURCE_REPO="${{ github.repository }}"
          SOURCE_REPO="${SOURCE_REPO%-shadow}"
          PREVIEW_BRANCH="shadow-preview/issue-${ISSUE_NUM}"
          git push \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/${SOURCE_REPO}.git" \
            --delete "${PREVIEW_BRANCH}" 2>/dev/null || true
          echo "Cleaned up ${SOURCE_REPO}:${PREVIEW_BRANCH}"

  # ── Job 7.5: API-driven behavioral validation ──────────────────────
  # Runs Sentinel scenarios against the deployed preview. Emits a verdict
  # (unchanged | expected-diff | new-behavior | regression | skipped) and a
  # signed attestation that shadow-upstream-pr can verify without re-running.
  validate-api:
    name: "API Validate (#${{ inputs.issue_number }})"
    needs: [read-config, verify-fix-branch, deploy-preview]
    if: |
      always() && !cancelled() &&
      needs.deploy-preview.result == 'success' &&
      needs.deploy-preview.outputs.preview_deployed == 'true'
    uses: ./.github/workflows/reusable-validate.yml
    with:
      preview_url:   ${{ needs.deploy-preview.outputs.backend_url }}
      preview_url_template: ${{ vars.PREVIEW_BACKEND_URL_TEMPLATE || '' }}
      preview_prefix: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
      preview_domain: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
      preview_port_base: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
      target_env:    ${{ inputs.base == 'main' && 'production' || 'dev' }}
      issue_number:  ${{ inputs.issue_number }}
      sentinel_ref:  '4cc5e066f48898a5e1b5a72c021981cc794630f3'
      shared_tools_ref: ${{ inputs.shared_tools_ref }}
      # For shadow runs, the validation manifest lives in the source repo, not the shadow.
      # source_repo is empty on non-shadow runs, so manifest_repo defaults to caller repo.
      manifest_repo: ${{ needs.deploy-preview.outputs.source_repo }}
      manifest_ref:  ${{ inputs.base }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      VALIDATION_ATTESTATION_KEY: ${{ secrets.VALIDATION_ATTESTATION_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

  # ── Job 7.6: Application test suite ────────────────────────────
  # Runs the app's own E2E/integration tests against the live preview.
  # Failures remain observable in the PR body and block release readiness.
  # Opt-in per app via `.autopilot/config.json → appTestCommand`.
  app-tests:
    name: "App Tests (#${{ inputs.issue_number }})"
    needs: [read-config, verify-fix-branch, deploy-preview]
    if: |
      always() && !cancelled() &&
      needs.deploy-preview.result == 'success' &&
      needs.deploy-preview.outputs.preview_deployed == 'true' &&
      needs.read-config.outputs.app_test_command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      app_tests_passed: ${{ steps.result.outputs.app_tests_passed }}
      app_tests_has_regressions: ${{ steps.compare.outputs.has_regressions }}
      baseline_label: ${{ steps.compare.outputs.baseline_label }}

    steps:
      - name: Checkout fix branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-fix-branch.outputs.head_sha }}
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: false

      - name: Fetch shared scripts
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          SHARED_TOOLS_REF: ${{ inputs.shared_tools_ref }}
        run: |
          set -euo pipefail
          git init /tmp/org-github
          git -C /tmp/org-github remote add origin \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/cloudwarriors-ai/.github.git"
          git -C /tmp/org-github fetch --depth 1 origin "$SHARED_TOOLS_REF"
          git -C /tmp/org-github remote set-url origin https://github.com/cloudwarriors-ai/.github.git
          git -C /tmp/org-github checkout --detach FETCH_HEAD
          test "$(git -C /tmp/org-github rev-parse HEAD)" = "$SHARED_TOOLS_REF"

      - name: Resolve preview URLs inside this job
        env:
          OUTPUT_PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url || '' }}
          OUTPUT_BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url || '' }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE || '' }}
          PREVIEW_BACKEND_URL_TEMPLATE: ${{ vars.PREVIEW_BACKEND_URL_TEMPLATE || '' }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          port=$((PREVIEW_PORT_BASE + ISSUE_NUM)); port_api=$((port + 1000))
          render() { echo "$1" | sed -e "s/{prefix}/${PREVIEW_PREFIX}/g" -e "s/{issue}/${ISSUE_NUM}/g" -e "s/{domain}/${PREVIEW_DOMAIN}/g" -e "s/{port_api}/${port_api}/g" -e "s/{port}/${port}/g"; }
          preview_url="$OUTPUT_PREVIEW_URL"
          backend_url="$OUTPUT_BACKEND_URL"
          if [ -n "$PREVIEW_URL_TEMPLATE" ]; then preview_url="$(render "$PREVIEW_URL_TEMPLATE")"; fi
          if [ -n "$PREVIEW_BACKEND_URL_TEMPLATE" ]; then backend_url="$(render "$PREVIEW_BACKEND_URL_TEMPLATE")"; fi
          if ! [[ "$preview_url" =~ ^https://[^[:space:]]+$ ]] || ! [[ "$backend_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "ERROR: could not derive both preview URLs inside the app-test job" >&2
            exit 1
          fi
          echo "TEST_BASE_URL=$preview_url" >> "$GITHUB_ENV"
          echo "SENTINEL_BASE_URL=$backend_url" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install Playwright browsers
        run: |
          if [ -f package.json ] && grep -q '"@playwright/test"' package.json 2>/dev/null; then
            npx --yes playwright install --with-deps chromium
          fi

      - name: Setup Python
        if: needs.read-config.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.read-config.outputs.python_version }}
          cache: pip

      - name: Install Python dependencies
        if: needs.read-config.outputs.runtime == 'python'
        env:
          REQS: ${{ needs.read-config.outputs.python_requirements }}
        run: |
          if [ -f "$REQS" ]; then
            python -m pip install --upgrade pip
            pip install -r "$REQS"
          fi
          pip install httpx pytest pytest-asyncio

      - name: Run app test suite
        id: app_tests
        continue-on-error: true
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.E2E_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          BROWSERBASE_LOCAL: 'true'
          CI: 'true'
          APP_TEST_CMD: ${{ needs.read-config.outputs.app_test_command }}
        run: |
          set -o pipefail
          mkdir -p /tmp/app-tests
          echo "Running: $APP_TEST_CMD"
          bash -c "$APP_TEST_CMD" 2>&1 | tee /tmp/app-tests/run.log

      - name: Parse results
        id: result
        if: always()
        run: |
          if [ "${{ steps.app_tests.outcome }}" = "success" ]; then
            echo "app_tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_tests_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against baseline
        id: compare
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATIC_BASELINE="tests/sentinel/baseline.json"
          DAILY_SNAPSHOT="tests/sentinel/daily-snapshot.json"

          if [ ! -f /tmp/app-tests/pytest.xml ] || [ ! -f /tmp/app-tests/run.log ]; then
            echo "::warning::Run artifacts missing at /tmp/app-tests/ — skipping comparison"
            echo "has_regressions=false" >> "$GITHUB_OUTPUT"
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prefer daily-snapshot.json fetched from shadow dev branch (not local
          # checkout — fix branches don't inherit it, and sync would delete it).
          BASELINE_FILE=""
          BASELINE_LABEL=""
          SHADOW_REPO="$GITHUB_REPOSITORY"
          SNAPSHOT_CONTENT=$(gh api "repos/${SHADOW_REPO}/contents/tests/sentinel/daily-snapshot.json?ref=dev" \
            --jq '.content' 2>/dev/null || echo "")
          if [ -n "$SNAPSHOT_CONTENT" ]; then
            echo "$SNAPSHOT_CONTENT" | base64 -d > /tmp/app-tests/daily-snapshot.json
            GENERATED_AT=$(python3 -c "import json; d=json.load(open('/tmp/app-tests/daily-snapshot.json')); print(d.get('generated_at',''))" 2>/dev/null || echo "")
            if [ -n "$GENERATED_AT" ]; then
              SNAPSHOT_AGE=$(python3 -c "from datetime import datetime,timezone; t=datetime.fromisoformat('${GENERATED_AT}'.replace('Z','+00:00')); print(int((datetime.now(timezone.utc)-t).total_seconds()))" 2>/dev/null || echo "999999")
              if [ "$SNAPSHOT_AGE" -lt 86400 ]; then
                SNAPSHOT_DATE=$(python3 -c "from datetime import datetime; t=datetime.fromisoformat('${GENERATED_AT}'.replace('Z','+00:00')); print(t.strftime('%Y-%m-%d %H:%M UTC'))" 2>/dev/null || echo "$GENERATED_AT")
                BASELINE_FILE="/tmp/app-tests/daily-snapshot.json"
                BASELINE_LABEL="daily snapshot (${SNAPSHOT_DATE})"
                echo "::notice::Using daily snapshot from ${SNAPSHOT_DATE}"
              else
                SNAPSHOT_HOURS=$(( SNAPSHOT_AGE / 3600 ))
                echo "::warning::Daily snapshot is ${SNAPSHOT_HOURS}h old — falling back to static baseline"
              fi
            fi
          fi

          if [ -z "$BASELINE_FILE" ]; then
            if [ ! -f "$STATIC_BASELINE" ]; then
              echo "::notice::No baseline found — first run or baseline not yet committed"
              echo "has_regressions=false" >> "$GITHUB_OUTPUT"
              echo "has_report=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            STATIC_DATE=$(python3 -c "import json; d=json.load(open('$STATIC_BASELINE')); print(d.get('generated_at','unknown')[:10])" 2>/dev/null || echo "unknown")
            BASELINE_FILE="$STATIC_BASELINE"
            SNAPSHOT_EXISTS=$([ -n "$SNAPSHOT_CONTENT" ] && echo "true" || echo "false")
            if [ "$SNAPSHOT_EXISTS" = "true" ]; then
              BASELINE_LABEL="static baseline (${STATIC_DATE}) ⚠️ daily snapshot stale"
            else
              BASELINE_LABEL="static baseline (${STATIC_DATE})"
            fi
            echo "::notice::Using static baseline from ${STATIC_DATE}"
          fi

          python3 /tmp/org-github/scripts/autopilot/compare-app-tests.py \
            --baseline "$BASELINE_FILE" \
            --baseline-label "$BASELINE_LABEL" \
            --pytest-xml /tmp/app-tests/pytest.xml \
            --playwright-log /tmp/app-tests/run.log \
            --output /tmp/app-tests/regression-report.md \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --regressions-out /tmp/app-tests/has-regressions.txt
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          HAS_REGS=$(cat /tmp/app-tests/has-regressions.txt)
          echo "has_regressions=${HAS_REGS}" >> "$GITHUB_OUTPUT"
          echo "baseline_label=${BASELINE_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Upload app-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-tests-${{ inputs.issue_number }}
          path: |
            /tmp/app-tests/
            playwright-report/
            test-results/
          retention-days: 90
          if-no-files-found: ignore

  # ── Job 8: Upsert PR and update labels ─────────────────────────────
  finalize:
    name: "Finalize (#${{ inputs.issue_number }})"
    needs: [rlm-fix, read-config, verify-fix-branch, validate, preflight, deploy-preview, test, validate-api, app-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pr_ready: ${{ steps.pr.outputs.pr_ready }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      preview_held: ${{ steps.hold-status.outputs.preview_held }}

    # RELEASE_READY is the one merge/readiness contract for gated and ungated work.
    # PREVIEW_CANDIDATE adds the explicit feature-track preview opt-in. The held
    # output is not true until the marker step itself succeeds.
    env:
      RELEASE_READY: ${{ needs.rlm-fix.result == 'success' && needs.verify-fix-branch.outputs.branch_ready == 'true' && needs.validate.outputs.validation_passed == 'true' && needs.preflight.outputs.preflight_passed == 'true' && (needs.read-config.outputs.preview_deploy != 'true' || needs.deploy-preview.outputs.preview_deployed == 'true') && (needs.read-config.outputs.test_command == '' || needs.test.outputs.tests_passed == 'true') && (needs.read-config.outputs.preview_deploy != 'true' || (needs.validate-api.result == 'success' && needs.validate-api.outputs.api_validation_passed == 'true' && (needs.read-config.outputs.validation_state != 'active' || needs.validate-api.outputs.verdict != 'skipped'))) && (needs.read-config.outputs.app_test_command == '' || (needs.app-tests.result == 'success' && needs.app-tests.outputs.app_tests_passed == 'true' && needs.app-tests.outputs.app_tests_has_regressions != 'true')) }}
      PREVIEW_CANDIDATE: ${{ needs.read-config.outputs.preview_gate == 'true' && inputs.track == 'features' && needs.rlm-fix.result == 'success' && needs.verify-fix-branch.outputs.branch_ready == 'true' && needs.validate.outputs.validation_passed == 'true' && needs.preflight.outputs.preflight_passed == 'true' && needs.deploy-preview.outputs.preview_deployed == 'true' && (needs.read-config.outputs.test_command == '' || needs.test.outputs.tests_passed == 'true') && needs.validate-api.result == 'success' && needs.validate-api.outputs.api_validation_passed == 'true' && (needs.read-config.outputs.validation_state != 'active' || needs.validate-api.outputs.verdict != 'skipped') && (needs.read-config.outputs.app_test_command == '' || (needs.app-tests.result == 'success' && needs.app-tests.outputs.app_tests_passed == 'true' && needs.app-tests.outputs.app_tests_has_regressions != 'true')) }}

    steps:
      - name: Checkout fix branch
        id: checkout
        if: needs.verify-fix-branch.outputs.already_fixed != 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-fix-branch.outputs.head_sha }}
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch shared scripts
        if: needs.verify-fix-branch.outputs.already_fixed != 'true'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          SHARED_TOOLS_REF: ${{ inputs.shared_tools_ref }}
        run: |
          set -euo pipefail
          git init /tmp/org-github
          git -C /tmp/org-github remote add origin \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/cloudwarriors-ai/.github.git"
          git -C /tmp/org-github fetch --depth 1 origin "$SHARED_TOOLS_REF"
          git -C /tmp/org-github remote set-url origin https://github.com/cloudwarriors-ai/.github.git
          git -C /tmp/org-github checkout --detach FETCH_HEAD
          test "$(git -C /tmp/org-github rev-parse HEAD)" = "$SHARED_TOOLS_REF"

      - name: Build matrix
        if: always() && needs.verify-fix-branch.outputs.already_fixed != 'true'
        id: matrix
        env:
          VALIDATION: ${{ needs.validate.outputs.validation_passed }}
          PREFLIGHT: ${{ needs.preflight.outputs.preflight_passed }}
          TESTS: ${{ needs.test.outputs.tests_passed || 'skip' }}
          API_VALIDATION: ${{ needs.validate-api.outputs.api_validation_passed || 'skip' }}
          API_VERDICT: ${{ needs.validate-api.outputs.verdict || 'skipped' }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          CONTRACT=$( [ "$VALIDATION" = "true" ] && echo "pass" || echo "fail" )
          INTEGRATION=$( [ "$PREFLIGHT" = "true" ] && echo "pass" || echo "fail" )

          npx tsx /tmp/org-github/scripts/autopilot/matrix.ts \
            --issue "$ISSUE_NUM" \
            --contract-result "$CONTRACT" \
            --integration-result "$INTEGRATION" \
            --e2e-result "$TESTS" \
            --smoke-result "skip" \
            --attempt 1 \
            --model "rlm"

      - name: Upsert PR
        if: |
          needs.rlm-fix.result == 'success' &&
          needs.verify-fix-branch.outputs.branch_ready == 'true' &&
          steps.checkout.outcome == 'success' &&
          needs.validate.outputs.validation_passed == 'true' &&
          needs.preflight.outputs.preflight_passed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          ISSUE_HEAD: ${{ inputs.head }}
          EXPECTED_HEAD_SHA: ${{ needs.verify-fix-branch.outputs.head_sha }}
          ISSUE_BASE: ${{ inputs.base }}
          ISSUE_TRACK: ${{ inputs.track }}
          TESTS_RESULT: ${{ needs.test.outputs.tests_passed || 'skipped' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.outputs.preflight_passed || 'skipped' }}
          VALIDATION_RESULT: ${{ needs.validate.outputs.validation_passed || 'skipped' }}
          API_VALIDATION_RESULT: ${{ needs.validate-api.outputs.api_validation_passed || 'skipped' }}
          API_VERDICT: ${{ needs.validate-api.outputs.verdict || 'skipped' }}
          APP_TESTS_RESULT: ${{ needs.app-tests.outputs.app_tests_passed || 'skipped' }}
          APP_TESTS_REGRESSIONS: ${{ needs.app-tests.outputs.app_tests_has_regressions || 'n/a' }}
          APP_TESTS_BASELINE_LABEL: ${{ needs.app-tests.outputs.baseline_label || '' }}
          PREVIEW_DEPLOY_ENABLED: ${{ needs.read-config.outputs.preview_deploy }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_BACKEND_URL_TEMPLATE: ${{ vars.PREVIEW_BACKEND_URL_TEMPLATE || '' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
        run: |
          EXISTING_PR=$(gh pr list --head "$ISSUE_HEAD" --base "$ISSUE_BASE" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$PREVIEW_DEPLOY_ENABLED" = "true" ]; then
            PORT=$((PREVIEW_PORT_BASE + ISSUE_NUM)); PORT_API=$((PORT + 1000))
            if [ -n "$PREVIEW_BACKEND_URL_TEMPLATE" ]; then
              BACKEND_URL="$(echo "$PREVIEW_BACKEND_URL_TEMPLATE" | sed -e "s/{prefix}/${PREVIEW_PREFIX}/g" -e "s/{issue}/${ISSUE_NUM}/g" -e "s/{domain}/${PREVIEW_DOMAIN}/g" -e "s/{port_api}/${PORT_API}/g" -e "s/{port}/${PORT}/g")"
            else
              BACKEND_URL="https://${PREVIEW_PREFIX}${ISSUE_NUM}-api.${PREVIEW_DOMAIN}"
            fi
          else
            BACKEND_URL="disabled (preview deploy off)"
          fi

          # Enrich PR body — all fetches wrapped; failures degrade gracefully
          ISSUE_TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}" \
            --jq '.title // ""' 2>/dev/null || echo "")
          ISSUE_BODY_PREVIEW=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}" \
            --jq '(.body // "") | .[0:400]' 2>/dev/null || echo "")

          DIFF_TABLE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${ISSUE_BASE}...${ISSUE_HEAD}" \
            --jq '[.files[] | "| \(.filename) | \(.status) | +\(.additions) | -\(.deletions) |"] | join("\n")' \
            2>/dev/null || echo "| _(unavailable)_ | | | |")
          DIFF_SUMMARY=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${ISSUE_BASE}...${ISSUE_HEAD}" \
            --jq '"\(.files | length) file(s) changed, \([.files[].additions] | add // 0) insertion(s), \([.files[].deletions] | add // 0) deletion(s)"' \
            2>/dev/null || echo "")

          COMMIT_MSG=$(git log --format="%b" -1 HEAD 2>/dev/null | \
            grep -v "^Co-Authored-By:" | sed '/^[[:space:]]*$/d' | head -20 || echo "")

          case "$API_VERDICT" in
            unchanged)     VERDICT_LABEL="no API change detected" ;;
            expected-diff) VERDICT_LABEL="expected API differences" ;;
            new-behavior)  VERDICT_LABEL="new endpoints/behavior added" ;;
            regression)    VERDICT_LABEL="regression detected" ;;
            skipped)       VERDICT_LABEL="skipped" ;;
            *)             VERDICT_LABEL="${API_VERDICT}" ;;
          esac

          if [ "$APP_TESTS_RESULT" = "skipped" ]; then
            APP_TESTS_GATE="skipped"
          elif [ "$APP_TESTS_REGRESSIONS" = "true" ]; then
            APP_TESTS_GATE="⚠️ regression vs ${APP_TESTS_BASELINE_LABEL:-baseline} — see PR comment"
          else
            APP_TESTS_GATE="✅ no regressions vs ${APP_TESTS_BASELINE_LABEL:-baseline}"
          fi

          PR_BODY="$(cat <<PRBODY
          ## Autopilot Fix for Issue #${ISSUE_NUM}

          **Track:** ${ISSUE_TRACK} | **Base:** ${ISSUE_BASE} | **Head:** ${ISSUE_HEAD}

          ### Issue
          **${ISSUE_TITLE}**

          ${ISSUE_BODY_PREVIEW}

          ### What Changed
          | File | Status | Additions | Deletions |
          |------|--------|-----------|-----------|
          ${DIFF_TABLE}

          ${DIFF_SUMMARY}

          ### Fix Description
          ${COMMIT_MSG}

          ### Validation Gates
          | Gate | Result |
          |------|--------|
          | Preflight | ${PREFLIGHT_RESULT} |
          | Bundle validation | ${VALIDATION_RESULT} |
          | Sentinel API — ${VERDICT_LABEL} | ${API_VALIDATION_RESULT} |
          | Unit tests | ${TESTS_RESULT} |
          | App tests (E2E) | ${APP_TESTS_GATE} |

          **Preview:** ${BACKEND_URL}
          [View workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ---
          Closes #${ISSUE_NUM}
          - [ ] Human review complete
          PRBODY
          )"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            PR_NUM="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --head "$ISSUE_HEAD" \
              --base "$ISSUE_BASE" \
              --title "fix: resolve issue #${ISSUE_NUM}" \
              --body "$PR_BODY") || true
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' || echo "")
          fi

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          if [ -z "$PR_NUM" ]; then
            echo "pr_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr edit "$PR_NUM" --add-label "autopilot" || \
            echo "::warning::Could not add optional 'autopilot' label to PR #${PR_NUM}"
          PR_HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq .headRefOid)
          if [ "$PR_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head drifted: expected ${EXPECTED_HEAD_SHA}, found ${PR_HEAD_SHA}"
            echo "pr_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "pr_ready=true" >> "$GITHUB_OUTPUT"

      # --- Auto-merge if configured and all checks pass ---
      # A preview candidate never merges here: it waits on the human verdict. Every
      # other auto-merge still has to satisfy the complete release contract above.
      - name: Auto-merge
        if: |
          env.PREVIEW_CANDIDATE != 'true' &&
          env.RELEASE_READY == 'true' &&
          steps.pr.outputs.pr_ready == 'true' &&
          needs.read-config.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          EXPECTED_HEAD_SHA: ${{ needs.verify-fix-branch.outputs.head_sha }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          if [ -n "$PR" ]; then
            gh pr merge "$PR" --squash --auto --match-head-commit "$EXPECTED_HEAD_SHA" || echo "Auto-merge failed — PR may need reviews or its head changed"
          fi

      # --- Preview gate: hold for a human verdict instead of finishing ---
      # Runs only for a fully release-ready preview candidate. The PR is
      # already created and left un-merged; this labels the source issue
      # PREVIEW: Ready and posts the marker comment Praxis parses.
      - name: "On hold: label Preview Ready"
        id: preview-hold
        if: |
          env.PREVIEW_CANDIDATE == 'true' &&
          steps.pr.outputs.pr_ready == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PREVIEW_MARKER_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const issueNum = String(process.env.ISSUE_NUM || '');
            const port = Number(process.env.PREVIEW_PORT_BASE || '20000') + Number(issueNum || 0);
            const renderUrl = (tpl) => tpl
              .replaceAll('{prefix}', process.env.PREVIEW_PREFIX || 'preview-')
              .replaceAll('{issue}', issueNum)
              .replaceAll('{domain}', process.env.PREVIEW_DOMAIN || 'pscx.ai')
              .replaceAll('{port_api}', String(port + 1000))
              .replaceAll('{port}', String(port));
            const previewUrl = process.env.PREVIEW_URL_TEMPLATE
              ? renderUrl(process.env.PREVIEW_URL_TEMPLATE)
              : (process.env.PREVIEW_URL || `https://${process.env.PREVIEW_PREFIX || 'preview-'}${issueNum}.${process.env.PREVIEW_DOMAIN || 'pscx.ai'}`);
            if (!/^https:\/\/\S+$/.test(previewUrl)) {
              core.setFailed(`hold: could not derive a preview URL (template='${process.env.PREVIEW_URL_TEMPLATE}', output='${process.env.PREVIEW_URL}')`);
              return;
            }

            // The PR lives in the repo that ran the fix (the shadow repo on shadow
            // runs). Its head sha is what the reviewer and Praxis correlate on.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            const prUrl = pr.html_url;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            if (headSha !== expectedHeadSha) {
              core.setFailed(`hold: PR head drifted after verification (expected ${expectedHeadSha}, found ${headSha})`);
              return;
            }

            // Where the human verdict is expected. Non-shadow: this repo's issue.
            // Shadow: the upstream source issue, resolved exactly the way
            // "Cross-post shadow status to source issue" resolves it below.
            let targetOwner = context.repo.owner;
            let targetRepo = context.repo.repo;
            let targetIssue = Number(process.env.ISSUE_NUM);

            if (context.repo.repo.endsWith('-shadow')) {
              let config = null;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path: '.shadow/config.json',
                });
                config = JSON.parse(Buffer.from(data.content, 'base64').toString());
              } catch (e) {
                core.warning(`Cannot read .shadow/config.json: ${e.message}`);
              }
              if (config && config.sourceRepo) {
                const reverseMap = Object.fromEntries(
                  Object.entries(config.issueMap || {}).map(([src, shad]) => [String(shad), Number(src)])
                );
                let sourceIssueNumber = reverseMap[String(targetIssue)];
                if (!sourceIssueNumber) {
                  try {
                    const { data: shadowIssue } = await github.rest.issues.get({
                      owner: context.repo.owner, repo: context.repo.repo, issue_number: targetIssue,
                    });
                    const ms = [...(shadowIssue.body || '').matchAll(/Shadow of \[.*?#(\d+)\]/g)];
                    if (ms.length) sourceIssueNumber = Number(ms[ms.length - 1][1]);
                  } catch (e) {
                    core.warning(`Could not fetch shadow issue body: ${e.message}`);
                  }
                }
                if (sourceIssueNumber) {
                  [targetOwner, targetRepo] = config.sourceRepo.split('/');
                  targetIssue = sourceIssueNumber;
                } else {
                  core.warning(`No source issue mapping for shadow issue #${targetIssue} — holding on the shadow issue itself`);
                }
              }
            }

            // Held, not in QA: drop In Progress, add PREVIEW: Ready (addLabels
            // creates the label if the repo does not have it yet), and never add
            // STATUS: In QA — QA is what the human verdict decides.
            try {
              await github.rest.issues.removeLabel({
                owner: targetOwner, repo: targetRepo,
                issue_number: targetIssue, name: 'STATUS: In Progress',
              });
            } catch {}
            const heldLabels = await github.rest.issues.listLabelsOnIssue({
              owner: targetOwner, repo: targetRepo, issue_number: targetIssue,
            });
            if (!heldLabels.data.some(l => l.name === 'PREVIEW: Ready')) {
              await github.rest.issues.addLabels({
                owner: targetOwner, repo: targetRepo,
                issue_number: targetIssue, labels: ['PREVIEW: Ready'],
              });
            }

            // First line is a machine contract Praxis parses — single spaces, no
            // trailing text. Keep it byte-exact:
            //   <!-- praxis:preview url=<preview_url> sha=<40-hex head sha> pr=<pr number> -->
            const markerPrefix = '<!-- praxis:preview ';
            const marker = `${markerPrefix}url=${previewUrl} sha=${headSha} pr=${prNumber} -->`;
            const body = [
              marker,
              '### Preview ready for review',
              '',
              `**Preview:** ${previewUrl}`,
              `**Commit:** \`${headSha}\``,
              `**PR:** ${prUrl}`,
              '',
              'This run is held: the preview is still up and the PR is not merged.',
              'Reply on this issue with exactly one of:',
              '',
              '- `preview pass` — the preview is right; release the hold and merge.',
              '- `preview fail: <why>` — something is wrong; say what, and autopilot takes another pass.',
              '- `needs decision: <question>` — a product call is needed before this can proceed.',
            ].join('\n');

            // A marker is attempt-current evidence, not a revision singleton. A fresh run must
            // always create a fresh comment even when url/sha/pr are unchanged; Praxis's attempt
            // boundary and same-attempt idempotency decide whether that event advances state.
            await github.rest.issues.createComment({
              owner: targetOwner, repo: targetRepo,
              issue_number: targetIssue, body,
            });
            console.log(`Preview gate held ${targetOwner}/${targetRepo}#${targetIssue} on ${previewUrl}`);
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          # Actions drops any job OUTPUT that contains a secret value. The tailnet hostname
          # noob-root.tailcc6c5f.ts.net contains SSH_USER ("root"), so preview_url above
          # arrives EMPTY on such hosts. Re-render from the template here instead (env is
          # not scrubbed); the deploy job already verified the same URL was reachable.
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE || '' }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PREFIX || 'preview-' }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'pscx.ai' }}
          PREVIEW_PORT_BASE: ${{ vars.PREVIEW_PORT_BASE || '20000' }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          EXPECTED_HEAD_SHA: ${{ needs.verify-fix-branch.outputs.head_sha }}

      # --- Update issue labels ---
      # A held run stops before In QA — the preview verdict decides that.
      - name: "On success: label In QA"
        if: |
          env.PREVIEW_CANDIDATE != 'true' &&
          env.RELEASE_READY == 'true' &&
          steps.pr.outputs.pr_ready == 'true' &&
          needs.verify-fix-branch.outputs.already_fixed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }}, name: 'STATUS: In Progress',
              });
            } catch {}
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }}, name: 'STATUS: Follow-Up Required',
              });
            } catch {}
            const inQaLabels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
            });
            if (!inQaLabels.data.some(l => l.name === 'STATUS: In QA')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }},
                labels: ['STATUS: In QA'],
              });
            }

      - name: "On already fixed: mark no PR needed"
        if: |
          needs.rlm-fix.result == 'success' &&
          needs.verify-fix-branch.outputs.already_fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ inputs.issue_number }};
            for (const name of [
              'STATUS: In Progress',
              'STATUS: Follow-Up Required',
              'AUTOFIX: Ready',
              'AUTOPILOT: Queue',
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch {}
            }

            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (!labels.data.some(l => l.name === 'STATUS: In QA')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['STATUS: In QA'],
              });
            }

            const marker = '<!-- AUTOPILOT_ALREADY_FIXED -->';
            const body = [
              marker,
              '### Autopilot — Already Fixed',
              '',
              'The RLM/autofix pass found that the base branch already appears to satisfy this issue, so no fix branch or PR was created.',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Base | \`${{ inputs.base }}\` |`,
              `| Reason | \`${{ needs.verify-fix-branch.outputs.already_fixed_reason || 'base_already_satisfies_issue' }}\` |`,
              `| Run | [Workflow](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              '',
              'The Ready/Queue labels were removed so the queue agent does not rerun this stale issue. Human UAT can close the issue once confirmed.',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 50,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: "On failure: label Follow-Up Required"
        if: |
          needs.verify-fix-branch.outputs.already_fixed != 'true' &&
          (
            env.RELEASE_READY != 'true' ||
            steps.pr.outputs.pr_ready != 'true' ||
            (env.PREVIEW_CANDIDATE == 'true' && steps.preview-hold.outcome != 'success')
          )
        env:
          RLM_RESULT: ${{ needs.rlm-fix.result }}
          FIX_BRANCH_READY: ${{ needs.verify-fix-branch.outputs.branch_ready || 'false' }}
          FIX_BRANCH_FAILURE: ${{ needs.verify-fix-branch.outputs.failure_reason || '' }}
          PR_READY: ${{ steps.pr.outputs.pr_ready || 'false' }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || '' }}
          VALIDATION_RESULT: ${{ needs.validate.outputs.validation_passed || 'skipped' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.outputs.preflight_passed || 'skipped' }}
          TESTS_RESULT: ${{ needs.test.outputs.tests_passed || 'skipped' }}
          API_VALIDATION_RESULT: ${{ needs.validate-api.outputs.api_validation_passed || 'skipped' }}
          API_VERDICT: ${{ needs.validate-api.outputs.verdict || 'skipped' }}
          API_FAILURE_REASON: ${{ needs.validate-api.outputs.sentinel_failure_reason || '' }}
          APP_TESTS_RESULT: ${{ needs.app-tests.outputs.app_tests_passed || 'skipped' }}
          DEPLOY_PREVIEW_STATUS: ${{ needs.deploy-preview.outputs.preview_deployed || 'unknown' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }}, name: 'STATUS: In Progress',
              });
            } catch {}
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }}, name: 'STATUS: In QA',
              });
            } catch {}
            const followUpLabels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
            });
            if (!followUpLabels.data.some(l => l.name === 'STATUS: Follow-Up Required')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }},
                labels: ['STATUS: Follow-Up Required'],
              });
            }
            // ── Build a structured per-gate breakdown so the issue comment reflects
            //    what actually failed, not just "check the logs". This separates the
            //    "PR ready for review" signal from the "every job green" signal.
            const prReady = process.env.PR_READY === 'true';
            const prNumber = process.env.PR_NUMBER;
            const apiFailureReason = process.env.API_FAILURE_REASON || '';
            const icon = (v) => v === 'true' ? '✅' : (v === 'false' || v === 'skipped' ? '❌' : '⏭️');
            const gateRow = (name, raw, extra='') => `| ${name} | ${icon(raw)} ${raw}${extra ? ' — ' + extra : ''} |`;
            const apiExtra = apiFailureReason ? `reason: \`${apiFailureReason}\`` : (process.env.API_VERDICT && process.env.API_VERDICT !== 'skipped' ? `verdict: ${process.env.API_VERDICT}` : '');
            const branchExtra = process.env.FIX_BRANCH_FAILURE ? `reason: \`${process.env.FIX_BRANCH_FAILURE}\`` : '';
            const previewExtra = process.env.DEPLOY_PREVIEW_STATUS === 'false' ? 'preview unavailable — preview-dependent checks skipped' : '';
            const gateRows = [
              gateRow('RLM fix',           process.env.RLM_RESULT === 'success' ? 'true' : 'false'),
              gateRow('Fix branch',        process.env.FIX_BRANCH_READY, branchExtra),
              gateRow('Bundle validation', process.env.VALIDATION_RESULT),
              gateRow('Preflight',          process.env.PREFLIGHT_RESULT),
              gateRow('Preview deploy',     process.env.DEPLOY_PREVIEW_STATUS, previewExtra),
              gateRow('Project tests',      process.env.TESTS_RESULT),
              gateRow('Sentinel API',       process.env.API_VALIDATION_RESULT, apiExtra),
              gateRow('App tests (E2E)',    process.env.APP_TESTS_RESULT),
            ].join('\n');
            const prLine = prReady && prNumber
              ? `✅ **PR #${prNumber} created** — ready for human review`
              : `❌ **PR not created** — see failures below`;
            const recommendation = (() => {
              if (process.env.FIX_BRANCH_FAILURE === 'missing-head-branch') {
                return 'Autofix did not push a fix branch. Rerun after reviewing the RLM/Claude step.';
              }
              if (process.env.FIX_BRANCH_FAILURE === 'empty-diff') {
                return 'Autofix produced no diff. Verify whether the issue is already fixed; otherwise rerun with more precise issue context.';
              }
              if (process.env.FIX_BRANCH_FAILURE === 'rlm-fix-failed') {
                return 'The RLM/Claude fix step failed before a reviewable branch was produced. Rerun after addressing the fix-step error.';
              }
              if (!prReady) return 'Pipeline halted before PR creation — review workflow logs.';
              if (apiFailureReason === 'auth-failed') {
                return 'Sentinel could not authenticate against the preview (HTTP 401). The E2E_EMAIL / E2E_PASSWORD org secrets may not match the preview environment. PR diff is still reviewable.';
              }
              if (apiFailureReason === 'auth-forbidden') {
                return 'Sentinel authenticated but lacks permission for the validation endpoints (HTTP 403). The E2E user may need permission grants in the preview environment.';
              }
              if (apiFailureReason === 'preview-unreachable') {
                return 'Sentinel could not reach the preview environment. The VPS deploy may have failed or DNS for the preview URL is not propagating. Check Deploy Preview job and the preview URL.';
              }
              if (apiFailureReason === 'transient-http' || (process.env.API_VALIDATION_RESULT === 'false' && process.env.DEPLOY_PREVIEW_STATUS === 'false')) {
                return 'Likely infrastructure flake. Consider re-running the API Validate job or merging if the PR diff itself looks good.';
              }
              if (process.env.API_VERDICT === 'regression' || apiFailureReason === 'goldens-drift') {
                return 'Sentinel detected an API regression — review the validation report before merging.';
              }
              return 'PR exists but one or more gates failed. Review the gate breakdown above before merging.';
            })();
            const followUpMarker = '<!-- AUTOPILOT_FOLLOWUP -->';
            const followUpBody = [
              followUpMarker,
              '### Autopilot — Follow-Up Required',
              '',
              prLine,
              '',
              '| Gate | Result |',
              '|------|--------|',
              gateRows,
              '',
              `**Recommendation:** ${recommendation}`,
              '',
              `**Run:** [Workflow](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const followUpComments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }}, per_page: 50,
            });
            const existingFollowUp = followUpComments.data.find(c => c.body && c.body.includes(followUpMarker));
            if (existingFollowUp) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existingFollowUp.id, body: followUpBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }}, body: followUpBody,
              });
            }

      # --- Cross-post shadow PR status to source issue ---
      # Updates the <!-- SHADOW_RUN_ACTIVE --> comment on the source issue (created
      # by reusable-autopilot-intake) with the final outcome: either the shadow PR
      # link (success) or a follow-up notice (failure). Runs for shadow repos only.
      - name: Cross-post shadow status to source issue
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WORKFLOW_PAT }}
          script: |
            if (!context.repo.repo.endsWith('-shadow')) return;

            let config;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.shadow/config.json',
              });
              config = JSON.parse(Buffer.from(data.content, 'base64').toString());
            } catch (e) {
              core.warning(`Cannot read .shadow/config.json: ${e.message}`);
              return;
            }

            const [sourceOwner, sourceRepoName] = config.sourceRepo.split('/');
            const shadowIssueNumber = Number(${{ inputs.issue_number }});

            // Primary: reverse-map from config. May miss on brand-new issues due to
            // a race where the sync stamps AUTOFIX:Ready before writing config.json.
            const reverseMap = Object.fromEntries(
              Object.entries(config.issueMap || {}).map(([src, shad]) => [String(shad), Number(src)])
            );
            let sourceIssueNumber = reverseMap[String(shadowIssueNumber)];

            // Fallback: parse shadow issue body for "Shadow of [owner/repo#N]" footer.
            if (!sourceIssueNumber) {
              try {
                const { data: shadowIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: shadowIssueNumber,
                });
                // Last match: the sync appends the real footer at the end of the
                // body, after any synced maintainer-decision text.
                const ms = [...(shadowIssue.body || '').matchAll(/Shadow of \[.*?#(\d+)\]/g)];
                if (ms.length) sourceIssueNumber = Number(ms[ms.length - 1][1]);
              } catch (e) {
                core.warning(`Could not fetch shadow issue body: ${e.message}`);
              }
            }

            if (!sourceIssueNumber) {
              core.warning(`No source issue mapping found for shadow issue #${shadowIssueNumber}`);
              return;
            }

            const prNumber = '${{ steps.pr.outputs.pr_number }}';
            const alreadyFixed = '${{ needs.verify-fix-branch.outputs.already_fixed }}' === 'true';
            const shadowIssueUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${shadowIssueNumber}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- SHADOW_RUN_ACTIVE -->';

            const rows = [
              `| Shadow issue | [${context.repo.owner}/${context.repo.repo}#${shadowIssueNumber}](${shadowIssueUrl}) |`,
            ];
            let heading;
            if (prNumber) {
              const shadowPrUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
              rows.push(`| Shadow PR | [${context.repo.owner}/${context.repo.repo}#${prNumber}](${shadowPrUrl}) |`);
              rows.push(`| Workflow run | [View run](${runUrl}) |`);
              rows.push('| Status | Shadow PR open — awaiting auto-merge and upstream promotion |');
              heading = 'Fix Ready';
            } else if (alreadyFixed) {
              rows.push(`| Workflow run | [View run](${runUrl}) |`);
              rows.push('| Status | Already fixed on base branch — no shadow PR needed |');
              heading = 'Already Fixed';
            } else {
              rows.push(`| Workflow run | [View run](${runUrl}) |`);
              rows.push('| Status | ⚠️ Follow-up required — see shadow issue for details |');
              heading = 'Follow-Up Required';
            }

            const body = [
              marker,
              `### 🤖 Shadow Autopilot — ${heading}`,
              '',
              '| | |',
              '|--|--|',
              ...rows,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: sourceOwner,
              repo: sourceRepoName,
              issue_number: sourceIssueNumber,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: sourceOwner, repo: sourceRepoName,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: sourceOwner, repo: sourceRepoName,
                issue_number: sourceIssueNumber, body,
              });
            }
            console.log(`Cross-posted shadow ${prNumber ? 'PR' : 'follow-up'} to ${config.sourceRepo}#${sourceIssueNumber}`);

      # This is the only output teardown consumes. A candidate is held only when the
      # human-facing label/comment contract was actually delivered successfully.
      - name: Record preview hold status
        id: hold-status
        if: always()
        env:
          HOLD_STEP_OUTCOME: ${{ steps.preview-hold.outcome }}
        run: |
          if [ "$PREVIEW_CANDIDATE" = "true" ] && [ "$HOLD_STEP_OUTCOME" = "success" ]; then
            echo "preview_held=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview_held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail workflow when no reviewable, gate-passing PR was produced
        if: |
          needs.verify-fix-branch.outputs.already_fixed != 'true' &&
          (
            env.RELEASE_READY != 'true' ||
            steps.pr.outputs.pr_ready != 'true' ||
            (env.PREVIEW_CANDIDATE == 'true' && steps.preview-hold.outcome != 'success')
          )
        run: |
          echo "Autopilot did not produce a reviewable, gate-passing PR."
          echo "RLM result: ${{ needs.rlm-fix.result }}"
          echo "Fix branch ready: ${{ needs.verify-fix-branch.outputs.branch_ready || 'false' }}"
          echo "Fix branch failure: ${{ needs.verify-fix-branch.outputs.failure_reason || '' }}"
          echo "PR ready: ${{ steps.pr.outputs.pr_ready || 'false' }}"
          echo "Release ready: $RELEASE_READY"
          echo "Preview candidate: $PREVIEW_CANDIDATE"
          echo "Preview hold step: ${{ steps.preview-hold.outcome }}"
          exit 1
