name: Shadow Issue Sync (Reusable)

# Syncs issues from a source repo into a shadow repo.
# Reads .shadow/config.json for source_repo and issueMap.
# Upserts: create new shadow issues, update existing ones, close if source closed.

on:
  workflow_call:
    inputs:
      shadow_repo:
        description: 'Shadow repo full name (e.g. cloudwarriors-ai/cloudflow-shadow)'
        type: string
        required: true
      autoqueue_enabled:
        description: 'When true, AUTOFIX: Ready is stamped on shadow issues where the source issue also has it'
        type: string
        required: false
        default: 'false'
    outputs:
      issues_synced:
        description: 'Number of issues synced'
        value: ${{ jobs.sync.outputs.issues_synced }}

  workflow_dispatch:
    inputs:
      shadow_repo:
        description: 'Shadow repo full name (e.g. cloudwarriors-ai/cloudflow-shadow)'
        type: string
        required: true
      autoqueue_enabled:
        description: 'When true, stamp AUTOFIX: Ready on shadow issues where source has it'
        type: string
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    outputs:
      issues_synced: ${{ steps.sync.outputs.issues_synced }}
      source_repo: ${{ steps.sync.outputs.source_repo }}
      pending_praxis_batches: ${{ steps.sync.outputs.pending_praxis_batches }}

    steps:
      - name: Sync issues
        id: sync
        uses: actions/github-script@v7
        env:
          # Passed via env (not interpolated into the script body) so any value is safe — a stray
          # backtick/`${}` in the var can never break the step. Default off when unset.
          PRAXIS_OWNS_DISPATCH_REPOS: ${{ vars.PRAXIS_OWNS_DISPATCH_REPOS }}
        with:
          github-token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const [shadowOwner, shadowRepoName] = '${{ inputs.shadow_repo }}'.split('/');

            // ── 1. Read .shadow/config.json ──────────────────────────────────
            let config, configSha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: shadowOwner,
                repo: shadowRepoName,
                path: '.shadow/config.json',
              });
              configSha = data.sha;
              config = JSON.parse(Buffer.from(data.content, 'base64').toString());
            } catch (e) {
              core.setFailed(`.shadow/config.json not found in ${shadowOwner}/${shadowRepoName}: ${e.message}`);
              return;
            }

            const sourceRepo = config.sourceRepo;
            const [sourceOwner, sourceRepoName] = sourceRepo.split('/');
            const issueMap = config.issueMap || {};
            console.log(`Syncing from ${sourceRepo} → ${shadowOwner}/${shadowRepoName}`);
            console.log(`Existing issueMap entries: ${Object.keys(issueMap).length}`);

            // ── 2. Ensure required labels exist in shadow repo ───────────────
            const ensureLabel = async (name, color = 'ededed', description = '') => {
              try {
                await github.rest.issues.getLabel({ owner: shadowOwner, repo: shadowRepoName, name });
              } catch (e) {
                if (e.status === 404) {
                  try {
                    await github.rest.issues.createLabel({ owner: shadowOwner, repo: shadowRepoName, name, color, description });
                  } catch (ce) { /* may already exist from concurrent run */ }
                }
              }
            };
            await ensureLabel('shadow', '0075ca', 'Issue mirrored from an external source repo');
            await ensureLabel('AUTOFIX: Ready', '2da44e', 'Opt-in automated fix trigger for shadow issues');
            await ensureLabel('autopilot', '5319e7', 'PR created by autopilot runner');

            // ── 3. Fetch all issues from source (paginated) ──────────────────
            let page = 1, allIssues = [];
            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner: sourceOwner,
                repo: sourceRepoName,
                state: 'all',
                per_page: 100,
                page,
              });
              if (!data.length) break;
              // Filter out pull requests
              allIssues.push(...data.filter(i => !i.pull_request));
              if (data.length < 100) break;
              page++;
            }
            console.log(`Fetched ${allIssues.length} issues from ${sourceRepo}`);

            // ── 4. Upsert each issue in shadow ───────────────────────────────
            // Praxis interlock (repo-scoped, default off): when Praxis owns dispatch for this
            // source repo, the engine must NOT auto-decide to stamp `AUTOFIX: Ready` — Praxis
            // stamps it. Only the autoqueue stamp no-ops; shadow creation/sync below is unaffected.
            // Empty/unset org var => owns=false => identical behavior to today.
            const praxisOwnsDispatch = (process.env.PRAXIS_OWNS_DISPATCH_REPOS || '')
              .split(/[\s,]+/).filter(Boolean).includes(sourceRepo);
            if (praxisOwnsDispatch) {
              console.log(`Praxis owns dispatch for ${sourceRepo} — autoqueue stamping disabled (shadow sync continues).`);
            }
            const AUTOQUEUE_ENABLED = '${{ inputs.autoqueue_enabled }}' === 'true' && !praxisOwnsDispatch;
            // Labels that indicate a shadow issue is already being processed — do not
            // re-stamp AUTOFIX: Ready if any of these are present.
            const processingLabels = new Set([
              'AUTOFIX: Ready', 'STATUS: In Progress', 'STATUS: In QA',
              'STATUS: Follow-Up Required', 'AUTOPILOT: Skip', 'claude-working',
            ]);
            // Autopilot lifecycle labels — sync must never strip these.
            // Removing and re-adding them fires labeled events that re-trigger intake.
            const preservedShadowLabels = new Set([
              'claude-working',
              'AUTOFIX: Ready', 'AUTOPILOT: Skip',
              'STATUS: In Progress', 'STATUS: In QA', 'STATUS: Follow-Up Required',
            ]);
            // PRAXIS_BINDING_PATTERN: ^praxis\/a([1-9a-z][0-9a-z]{0,12})-([0-9a-f]{24})$
            const praxisBindingPattern = /^praxis\/a([1-9a-z][0-9a-z]{0,12})-([0-9a-f]{24})$/;
            const isPraxisMachineLabel = name => name.startsWith('praxis/a');

            // ── Maintainer decision carry ────────────────────────────────────
            // Source-issue comments never sync, so a design decision written as a
            // comment is invisible to the shadow writer — it implements the body's
            // "Suggested fix" instead (observed: scopely#1359 attempt 1 shipped a
            // rejected design). For issues in the active dispatch queue only,
            // comments a maintainer explicitly marked as decisions are appended to
            // the shadow body, which is the writer's entire spec surface.
            //  - Bounded: only open issues carrying a dispatch label (keeps the
            //    hourly sync's API cost proportional to the queue, not the repo).
            //  - Opt-in: only comments containing `AUTOPILOT-DECISION:` or an
            //    `## Accepted design` heading. Ordinary discussion never syncs.
            //  - Trust-gated: only OWNER/MEMBER/COLLABORATOR authors; drive-by
            //    comments can never inject into the writer's spec surface.
            const dispatchLabels = new Set(['AUTOFIX: Ready', 'AUTOPILOT: Queue', 'PRAXIS: Go']);
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            // Marker vocabulary is mirrored in the fixer policy
            // (.claude/rules/autopilot-fixer-policy.md, "Decision precedence") —
            // change both together. Line-start `Decision:` is deliberate; bare
            // "ratified" mid-prose is NOT a marker.
            const decisionPattern = /(^|\n)\s*(AUTOPILOT-DECISION:|Decision:|##\s*Accepted design)/i;
            const buildDecisionSection = async (src) => {
              if (src.state !== 'open') return '';
              if (!src.labels.some(l => dispatchLabels.has(l.name))) return '';
              if ((src.comments || 0) === 0) return '';
              let comments;
              try {
                comments = await github.paginate(github.rest.issues.listComments, {
                  owner: sourceOwner, repo: sourceRepoName,
                  issue_number: src.number, per_page: 100,
                });
              } catch (e) {
                console.log(`Could not fetch comments for #${src.number}: ${e.message}`);
                return '';
              }
              const decisions = comments.filter(c =>
                trustedAssociations.has(c.author_association) &&
                decisionPattern.test(c.body || '')
              );
              if (!decisions.length) return '';
              // When over budget, keep the NEWEST decisions — a later decision
              // supersedes an earlier one, so the tail is the authoritative part.
              // Selection walks newest-first; rendering stays chronological, and
              // dropped entries are announced, never silently omitted.
              const entries = decisions.map(c => {
                const raw = c.body || '';
                return `\n### @${c.user.login} — ${c.created_at.slice(0, 10)}\n${raw.slice(0, 1500)}${raw.length > 1500 ? '\n_[decision truncated at 1500 chars]_' : ''}`;
              });
              let budget = 4000;
              const kept = [];
              for (let k = entries.length - 1; k >= 0; k--) {
                if (entries[k].length > budget) break;
                kept.unshift(entries[k]);
                budget -= entries[k].length;
              }
              const omitted = entries.length - kept.length;
              const parts = [
                '\n\n---\n## Maintainer decisions (synced from source issue comments)',
                '_Marked as decisions by maintainers. Where these conflict with the issue text above, these control._',
              ];
              if (omitted > 0) {
                parts.push(`\n_[${omitted} earlier decision comment(s) omitted for length — newest retained; see source issue for full history]_`);
              }
              parts.push(...kept);
              return parts.join('\n');
            };

            let created = 0, updated = 0, preservedClosed = 0;
            let shadowOpenCount = 0, shadowClosedCount = 0;
            for (let i = 0; i < allIssues.length; i++) {
              const src = allIssues[i];
              const shadowFooter = `\n\n---\n*Shadow of [${sourceRepo}#${src.number}](${src.html_url})*`;
              const decisionSection = await buildDecisionSection(src);
              const body = (src.body || '') + decisionSection + shadowFooter;
              const title = src.title;
              const sourceState = src.state;
              let effectiveState = sourceState;

              // Mirror source labels, always add shadow marker.
              // AUTOFIX: Ready is NOT blindly mirrored — it is stamped conditionally
              // below based on AUTOQUEUE_ENABLED and shadow issue state.
              const sourceLabels = src.labels.map(l => l.name);
              const sourcePraxisLabels = sourceLabels.filter(isPraxisMachineLabel);
              if (sourcePraxisLabels.length > 0) {
                throw new Error(
                  `Source issue ${sourceRepo}#${src.number} contains shadow-only Praxis binding label(s): ${sourcePraxisLabels.join(', ')}`
                );
              }
              const sourceHasAutofix = sourceLabels.includes('AUTOFIX: Ready');
              const sourceHasAutopilotSkip = sourceLabels.includes('AUTOPILOT: Skip');
              const filteredSourceLabels = sourceLabels.filter(l => l !== 'AUTOFIX: Ready');
              let labels = [...new Set([...filteredSourceLabels, 'shadow'])];

              // Ensure all mirrored source labels exist in shadow
              for (const lbl of filteredSourceLabels) {
                await ensureLabel(lbl);
              }

              const shadowNumber = issueMap[String(src.number)];

              if (shadowNumber) {
                const { data: shadowIssue } = await github.rest.issues.get({
                  owner: shadowOwner,
                  repo: shadowRepoName,
                  issue_number: shadowNumber,
                });
                const currentShadowLabels = shadowIssue.labels.map(l => typeof l === 'string' ? l : l.name);
                const machinePraxisLabels = currentShadowLabels.filter(isPraxisMachineLabel);
                const malformedPraxisLabels = machinePraxisLabels.filter(name => !praxisBindingPattern.test(name));
                if (malformedPraxisLabels.length > 0) {
                  throw new Error(
                    `Shadow issue ${shadowOwner}/${shadowRepoName}#${shadowNumber} has malformed Praxis binding label(s): ${malformedPraxisLabels.join(', ')}`
                  );
                }
                if (machinePraxisLabels.length > 1) {
                  throw new Error(
                    `Shadow issue ${shadowOwner}/${shadowRepoName}#${shadowNumber} has multiple Praxis bindings`
                  );
                }
                labels = [...new Set([
                  ...labels,
                  ...currentShadowLabels.filter(name => preservedShadowLabels.has(name)),
                  ...(sourceState === 'open' ? machinePraxisLabels : []),
                ])];

                // Stamp AUTOFIX: Ready when:
                //   - source issue has AUTOFIX: Ready
                //   - AUTOQUEUE_ENABLED is true
                //   - shadow issue is open and not already in a processing state
                const shadowAlreadyProcessing = currentShadowLabels.some(l => processingLabels.has(l));
                if (sourceHasAutofix && AUTOQUEUE_ENABLED && sourceState === 'open' && !sourceHasAutopilotSkip && !shadowAlreadyProcessing) {
                  labels = [...new Set([...labels, 'AUTOFIX: Ready'])];
                  console.log(`Stamping AUTOFIX: Ready on shadow issue #${shadowNumber} (autoqueue enabled)`);
                }

                // Preserve a completed shadow issue while the source issue remains
                // open and is waiting on upstream review/merge.
                if (shadowIssue.state === 'closed' && sourceState === 'open') {
                  effectiveState = 'closed';
                  preservedClosed++;
                }

                // Only update when something actually changed.
                // Passing `labels` in the payload fires labeled events for every label
                // in the array — omit it when labels haven't changed.
                const currentLabelSet = new Set(currentShadowLabels);
                const desiredLabelSet = new Set(labels);
                const labelsChanged =
                  currentLabelSet.size !== desiredLabelSet.size ||
                  [...desiredLabelSet].some(l => !currentLabelSet.has(l)) ||
                  [...currentLabelSet].some(l => !desiredLabelSet.has(l));
                const metaChanged =
                  shadowIssue.title !== title ||
                  shadowIssue.body !== body ||
                  shadowIssue.state !== effectiveState;

                if (metaChanged || labelsChanged) {
                  await github.rest.issues.update({
                    owner: shadowOwner,
                    repo: shadowRepoName,
                    issue_number: shadowNumber,
                    title,
                    body,
                    state: effectiveState,
                    ...(labelsChanged ? { labels } : {}),
                  });
                  updated++;
                }
                if (sourceState !== 'open') {
                  for (const binding of machinePraxisLabels) {
                    try {
                      await github.rest.issues.deleteLabel({
                        owner: shadowOwner,
                        repo: shadowRepoName,
                        name: binding,
                      });
                    } catch (error) {
                      if (error.status !== 404) throw error;
                    }
                  }
                }
              } else {
                // Create new shadow issue — stamp AUTOFIX: Ready immediately if source has
                // it and autoqueue is enabled (issue is inherently open at creation time).
                if (sourceHasAutofix && AUTOQUEUE_ENABLED && sourceState === 'open' && !sourceHasAutopilotSkip) {
                  labels = [...new Set([...labels, 'AUTOFIX: Ready'])];
                  console.log(`Stamping AUTOFIX: Ready on new shadow issue for source #${src.number} (autoqueue enabled)`);
                }

                const { data: created_issue } = await github.rest.issues.create({
                  owner: shadowOwner,
                  repo: shadowRepoName,
                  title,
                  body,
                  labels,
                });
                issueMap[String(src.number)] = created_issue.number;

                if (sourceState === 'closed') {
                  await github.rest.issues.update({
                    owner: shadowOwner,
                    repo: shadowRepoName,
                    issue_number: created_issue.number,
                    state: 'closed',
                  });
                }
                created++;
              }

              if (effectiveState === 'closed') {
                shadowClosedCount++;
              } else {
                shadowOpenCount++;
              }

              // Rate limit mitigation: sleep 1s every 30 upserts
              if ((i + 1) % 30 === 0) {
                await new Promise(r => setTimeout(r, 1000));
              }
            }

            const totalSynced = allIssues.length;
            const sourceOpenCount = allIssues.filter(i => i.state === 'open').length;
            const sourceClosedCount = totalSynced - sourceOpenCount;
            console.log(`Created: ${created}, Updated: ${updated}, Preserved closed: ${preservedClosed}`);

            // ── 5. Write back updated config.json ────────────────────────────
            const updatedConfig = {
              ...config,
              lastSyncAt: new Date().toISOString(),
              syncStats: {
                totalSynced,
                open: shadowOpenCount,
                closed: shadowClosedCount,
                sourceOpen: sourceOpenCount,
                sourceClosed: sourceClosedCount,
                preservedClosed,
              },
              issueMap,
            };

            await github.rest.repos.createOrUpdateFileContents({
              owner: shadowOwner,
              repo: shadowRepoName,
              path: '.shadow/config.json',
              sha: configSha,
              message: `chore: shadow sync [${totalSynced} issues, +${created} new]`,
              content: Buffer.from(JSON.stringify(updatedConfig, null, 2)).toString('base64'),
            });

            const pendingPraxisReports = praxisOwnsDispatch
              ? await github.paginate(github.rest.search.issuesAndPullRequests, {
                q: `repo:${sourceRepo} is:issue in:comments "AUTOPILOT_SHADOW_TRIGGER_V1" "Praxis is waiting to complete"`,
                per_page: 100,
              })
              : [];
            if (pendingPraxisReports.length >= 1000) {
              throw new Error('pending Praxis report search reached GitHub 1000-result limit');
            }
            const pendingPraxisBridges = pendingPraxisReports.map(issue => issue.number);
            const pendingPraxisBatches = [];
            for (let offset = 0; offset < pendingPraxisBridges.length; offset += 100) {
              const issue_numbers =
                JSON.stringify(pendingPraxisBridges.slice(offset, offset + 100));
              pendingPraxisBatches.push({ issue_numbers });
            }
            if (pendingPraxisBatches.length > 256) {
              throw new Error('pending Praxis bridge matrix exceeds 256 batches');
            }
            core.setOutput('issues_synced', totalSynced);
            core.setOutput('source_repo', sourceRepo);
            core.setOutput('pending_praxis_batches', JSON.stringify(pendingPraxisBatches));
            console.log(`Sync complete. ${totalSynced} issues total.`);

            // ── Summary ──────────────────────────────────────────────────────
            const summary = [
              `### Shadow Sync: ${sourceRepo} → ${shadowOwner}/${shadowRepoName}`,
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Source issues | ${totalSynced} |`,
              `| Created | ${created} |`,
              `| Updated | ${updated} |`,
              `| Shadow open | ${shadowOpenCount} |`,
              `| Shadow closed | ${shadowClosedCount} |`,
              `| Source open | ${sourceOpenCount} |`,
              `| Source closed | ${sourceClosedCount} |`,
              `| Preserved closed shadow issues | ${preservedClosed} |`,
            ].join('\n');
            await core.summary.addRaw(summary).write();

  reconcile:
    needs: sync
    if: needs.sync.outputs.pending_praxis_batches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.pending_praxis_batches) }}
    steps:
      - name: Reconcile pending Praxis shadow dispatches
        uses: cloudwarriors-ai/.github/.github/actions/praxis-shadow-state@main
        with:
          mode: reconcile
          token: ${{ secrets.WORKFLOW_PAT }}
          repo: ${{ needs.sync.outputs.source_repo }}
          issue-numbers: ${{ matrix.issue_numbers }}
          trusted-source-actor-id: ${{ vars.PRAXIS_GITHUB_ACTOR_ID }}
